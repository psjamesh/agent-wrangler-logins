name: Test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - run: npm run docs:check
  integration:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/checkout@v4
        with:
          repository: psjamesh/agent-wrangler
          ref: 033d709b4c3373289e491d9b03325a041dedd8ea
          path: host
      - run: npm ci --prefix host
      - run: npm run test:integration
        env:
          AW_HOST_CHECKOUT: ${{ github.workspace }}/host
