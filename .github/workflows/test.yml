name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - run: npm run docs:check
  integration:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/checkout@v4
        with:
          repository: psjamesh/agent-wrangler
          ref: 6f8214cd2a9b15321ca1ca77e97a3601b7d3996c
          path: host
      - run: npm ci --prefix host
      - run: npm run test:integration
        env:
          AW_HOST_CHECKOUT: ${{ github.workspace }}/host
